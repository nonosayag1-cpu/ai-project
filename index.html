<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI Helper</title>
</head>

<body>
<h1>🤖 AI Helper</h1>
<p>הכלי הראשון שלי</p>

<textarea id="input" rows="6" cols="35"
placeholder="כתוב כאן..."></textarea>

<br><br>

<button onclick="answer()">בדוק</button>

<h2>תוצאה:</h2>
<p id="output"></p>

<script>
function answer() {
    let text = document.getElementById("input").value;

    if (text.includes("עסק")) {
        document.getElementById("output").innerText =
        "רעיון: שירות שעוזר לעסקים לחסוך זמן במשימות חוזרות.";
    } else if (text.includes("רעיון")) {
        document.getElementById("output").innerText =
        "רעיון: כלי שעוזר לאנשים לארגן מידע בצורה אוטומטית.";
    } else {
        document.getElementById("output").innerText =
        "קיבלתי: " + text;
    }
}
</script>

</body>
</html>
