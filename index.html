<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Business Idea Helper</title>
</head>

<body>

<h1>💡 Business Idea Helper</h1>

<p>כתוב רעיון לעסק:</p>

<textarea id="idea" rows="5" cols="35"
placeholder="לדוגמה: שירות ניקוי רכבים"></textarea>

<br><br>

<button onclick="generate()">צור תוכנית</button>

<h2>התוצאה:</h2>

<div id="result"></div>

<script>
function generate() {

    const idea = document.getElementById("idea").value.trim();
    const result = document.getElementById("result");

    if (!idea) {
        result.innerText = "כתוב רעיון קודם 🙂";
        return;
    }

    result.innerHTML =
        "<b>הרעיון:</b> " + idea +
        "<br><br>" +
        "<b>קהל יעד:</b> אנשים שצריכים את השירות הזה." +
        "<br><br>" +
        "<b>איך אפשר להרוויח:</b> לגבות תשלום עבור השירות." +
        "<br><br>" +
        "<b>צעד ראשון:</b> למצוא 5 אנשים שיכולים להיות לקוחות ולבדוק אם הם באמת מעוניינים.";

}
</script>

</body>
</html>
